  <title>Invoice editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Invoice editor...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Semi Condensed';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/barlowsemicondensed/v16/wlpigxjLBV1hqnzfr-F8sEYMB0Yybp0mudRfw6-_CWslqZ6GfVK5.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Semi Condensed';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"485cd823-1c5e-4a94-ba91-0a4bddf7bcf7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F1F3F0;color:#1B2321;font-family:'Barlow','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.4}\na{color:#0B5D57}a:hover{color:#063F3B}\ninput,select,button{font:inherit;color:inherit}\ninput,select{box-sizing:border-box;width:100%;height:40px;padding:0 10px;border:1px solid #B9C1BC;border-radius:4px;background:#FFFFFF}\nbutton{cursor:pointer}\ninput:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #0B5D57;outline-offset:1px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"box-sizing: border-box; max-width: 1360px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 20px; font-variant-numeric: tabular-nums\" data-canvas-width=\"1360\" data-canvas-height=\"1040\">\n\n<div style=\"padding: 8px 12px; background: #FFF3C4; border: 1px solid #E0B93A; border-radius: 4px; color: #4A3A00; font-size: 14px\">Mock-up with sample data. Projects, clients, prices and dates are examples, not your Xero records. Nothing is sent to Xero from this page.<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end\">\n<div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<div style=\"font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #55605C\">Projects / Sample project / Quote and billing<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1\">Quote and billing<\u002Fh1>\n<div style=\"color: #55605C\">Sample project: electrical works<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-size: 13px; color: #55605C\">Client<\u002Fdiv>\n<div style=\"font-weight: 600\">Sample client<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-size: 13px; color: #55605C\">Date<\u002Fdiv>\n<div style=\"font-weight: 600\">1 Oct 2026<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<div style=\"font-size: 13px; color: #55605C\">Property type<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{types}}\" as=\"ty\" hint-placeholder-count=\"3\">\n<button type=\"button\" aria-pressed=\"{{ty.on}}\" sc-camel-on-click=\"{{ty.pick}}\" style=\"height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid #1B2321; font-weight: 600; background: {{ty.bg}}; color: {{ty.fg}}\">{{ty.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between\">\n<div style=\"font-size: 14px; color: #55605C\">Price suggestions use past {{typeLabel}} quotes. Other property types are shown for reference only.<\u002Fdiv>\n<label for=\"unit-toggle\" style=\"display: flex; gap: 8px; align-items: center; min-height: 44px; font-weight: 600; cursor: pointer\">\n<input id=\"unit-toggle\" type=\"checkbox\" checked=\"{{showUnit}}\" sc-camel-on-change=\"{{toggleUnit}}\" style=\"width: 20px; height: 20px; padding: 0; flex: none\">\nShow unit (sqft, ft run)\n<\u002Flabel>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #C9D0CB; border-radius: 6px; overflow-x: auto\">\n<div style=\"min-width: 1260px\">\n<div style=\"display: grid; grid-template-columns: {{cols}}; gap: 8px; padding: 10px 12px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #55605C; background: #E7EBE7\">\n<div>No.<\u002Fdiv>\n<div>Description<\u002Fdiv>\n<div>Service<\u002Fdiv>\n<div>{{qtyHead}}<\u002Fdiv>\n<div>Unit price<\u002Fdiv>\n<div style=\"text-align: right\">Amount<\u002Fdiv>\n<div>Line actions<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-for list=\"{{rows}}\" as=\"row\" hint-placeholder-count=\"6\">\n<div style=\"border-top: 1px solid #DDE1DD; background: {{row.bg}}\">\n<sc-if value=\"{{row.isTitle}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: grid; grid-template-columns: {{row.titleCols}}; gap: 8px; align-items: center; padding: 8px 12px\">\n<div><\u002Fdiv>\n<input type=\"text\" data-line=\"{{row.id}}\" aria-label=\"Section title\" placeholder=\"Section title, e.g. LIVING ROOM\" value=\"{{row.desc}}\" sc-camel-on-change=\"{{row.setDesc}}\" sc-camel-on-focus=\"{{row.focus}}\" sc-camel-on-key-down=\"{{row.key}}\" style=\"font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; border-color: #1B2321\">\n<div style=\"text-align: right; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #55605C\">Section subtotal<\u002Fdiv>\n<div style=\"text-align: right; font-weight: 600\">{{row.amount}}<\u002Fdiv>\n<div style=\"display: flex; gap: 4px; align-items: center\">\n<button type=\"button\" sc-camel-on-click=\"{{row.addAbove}}\" style=\"height: 40px; padding: 0 10px; border: 1px solid #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600; font-size: 14px; white-space: nowrap\">+ Above<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{row.addBelow}}\" style=\"height: 40px; padding: 0 10px; border: 1px solid #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600; font-size: 14px; white-space: nowrap\">+ Below<\u002Fbutton>\n<button type=\"button\" aria-label=\"Move title up\" title=\"Move title up\" sc-camel-on-click=\"{{row.up}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2321\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5\"><\u002Fpath><path d=\"M6 11l6-6 6 6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button type=\"button\" aria-label=\"Move title down\" title=\"Move title down\" sc-camel-on-click=\"{{row.down}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2321\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M6 13l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button type=\"button\" aria-label=\"Delete title\" title=\"Delete title (lines under it stay)\" sc-camel-on-click=\"{{row.del}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8A1F11\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16\"><\u002Fpath><path d=\"M9 7V4h6v3\"><\u002Fpath><path d=\"M6 7l1 13h10l1-13\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{row.isItem}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: grid; grid-template-columns: {{row.cols}}; gap: 8px; align-items: center; padding: 8px 12px\">\n<div style=\"font-weight: 600; color: #55605C\">{{row.n}}<\u002Fdiv>\n<input type=\"text\" data-line=\"{{row.id}}\" aria-label=\"{{row.descLabel}}\" placeholder=\"Start typing, e.g. socket, partition, ceiling\" value=\"{{row.desc}}\" sc-camel-on-change=\"{{row.setDesc}}\" sc-camel-on-focus=\"{{row.focus}}\" sc-camel-on-key-down=\"{{row.key}}\">\n<sc-raw-select aria-label=\"Service\" value=\"{{row.trade}}\" sc-camel-on-change=\"{{row.setTrade}}\" sc-camel-on-focus=\"{{row.focus}}\">\n<sc-for list=\"{{row.trades}}\" as=\"t\" hint-placeholder-count=\"7\">\n<option value=\"{{t}}\">{{t}}<\u002Foption>\n<\u002Fsc-for>\n<\u002Fsc-raw-select>\n<div style=\"display: flex; gap: 4px; min-width: 0\">\n<input type=\"text\" inputmode=\"decimal\" aria-label=\"Quantity\" value=\"{{row.qty}}\" sc-camel-on-change=\"{{row.setQty}}\" sc-camel-on-focus=\"{{row.focus}}\" style=\"flex: 1 1 0; min-width: 0; width: auto\">\n<sc-if value=\"{{row.showUnit}}\" hint-placeholder-val=\"{{false}}\">\n<sc-raw-select aria-label=\"Unit\" value=\"{{row.unit}}\" sc-camel-on-change=\"{{row.setUnit}}\" sc-camel-on-focus=\"{{row.focus}}\" style=\"width: 108px; flex: none; padding: 0 6px\">\n<sc-for list=\"{{row.units}}\" as=\"u\" hint-placeholder-count=\"6\">\n<option value=\"{{u.v}}\">{{u.label}}<\u002Foption>\n<\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fsc-if>\n<\u002Fdiv>\n<input type=\"text\" inputmode=\"decimal\" aria-label=\"Unit price\" placeholder=\"0.00\" value=\"{{row.price}}\" sc-camel-on-change=\"{{row.setPrice}}\" sc-camel-on-focus=\"{{row.focus}}\">\n<div style=\"text-align: right; font-weight: 600\">{{row.amount}}<\u002Fdiv>\n<div style=\"display: flex; gap: 4px; align-items: center\">\n<button type=\"button\" sc-camel-on-click=\"{{row.addAbove}}\" style=\"height: 40px; padding: 0 10px; border: 1px solid #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600; font-size: 14px; white-space: nowrap\">+ Above<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{row.addBelow}}\" style=\"height: 40px; padding: 0 10px; border: 1px solid #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600; font-size: 14px; white-space: nowrap\">+ Below<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{row.addTitle}}\" title=\"Add a section title above this line\" style=\"height: 40px; padding: 0 10px; border: 1px solid #1B2321; border-radius: 4px; background: #E9EDE9; font-weight: 600; font-size: 14px; white-space: nowrap\">+ Title<\u002Fbutton>\n<button type=\"button\" aria-label=\"Duplicate line\" title=\"Duplicate line\" sc-camel-on-click=\"{{row.dup}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2321\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"1\"><\u002Frect><path d=\"M5 15V5a1 1 0 0 1 1-1h10\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button type=\"button\" aria-label=\"Move line up\" title=\"Move line up\" sc-camel-on-click=\"{{row.up}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2321\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5\"><\u002Fpath><path d=\"M6 11l6-6 6 6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button type=\"button\" aria-label=\"Move line down\" title=\"Move line down\" sc-camel-on-click=\"{{row.down}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2321\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M6 13l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button type=\"button\" aria-label=\"Delete line\" title=\"Delete line\" sc-camel-on-click=\"{{row.del}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8A1F11\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16\"><\u002Fpath><path d=\"M9 7V4h6v3\"><\u002Fpath><path d=\"M6 7l1 13h10l1-13\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{row.hasNote}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 0 12px 10px 56px; font-size: 14px; color: #5C4300\">{{row.note}}<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{row.showSug}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"margin: 0 12px 12px 56px; border: 1px solid #E0B93A; border-radius: 4px; background: #FFFFFF; display: flex; flex-direction: column\">\n<div style=\"padding: 8px 12px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #4A3A00; background: #FFF3C4\">Quoted before. Pick one to fill the description and your last {{row.typeLabel}} price.<\u002Fdiv>\n<sc-for list=\"{{row.sugs}}\" as=\"s\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{s.pick}}\" style=\"display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.8fr) auto; gap: 16px; align-items: center; text-align: left; padding: 10px 12px; min-height: 56px; border: 0; border-top: 1px solid #EADFB4; background: #FFFFFF\">\n<div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<div style=\"font-weight: 600\">{{s.desc}}<\u002Fdiv>\n<div style=\"font-size: 14px; color: #55605C\">{{s.sub}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<div style=\"font-size: 14px; color: #55605C\">All past quotes<\u002Fdiv>\n<div style=\"font-size: 14px\">{{s.trail}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; align-items: flex-end\">\n<div style=\"font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px\">{{s.last}}<\u002Fdiv>\n<div style=\"font-size: 14px; color: #55605C\">{{s.lastMeta}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<button type=\"button\" sc-camel-on-click=\"{{row.dismiss}}\" style=\"padding: 10px 12px; min-height: 44px; border: 0; border-top: 1px solid #EADFB4; background: #FFFFFF; text-align: left; color: #0B5D57; font-weight: 600\">None of these. Keep what I typed.<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n\n<div style=\"border-top: 1px solid #DDE1DD; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<button type=\"button\" sc-camel-on-click=\"{{addEnd}}\" style=\"height: 44px; padding: 0 16px; border: 1px dashed #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600\">+ Add line at the end<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{addTitleEnd}}\" style=\"height: 44px; padding: 0 16px; border: 1px dashed #1B2321; border-radius: 4px; background: #E9EDE9; font-weight: 600\">+ Add title at the end<\u002Fbutton>\n<div style=\"font-size: 14px; color: #55605C\">Press Enter in a description to add a line directly below it.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-start\">\n<div style=\"flex: 1 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #C9D0CB; border-radius: 6px; display: flex; flex-direction: column\">\n<div style=\"padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; align-items: baseline\">\n<div style=\"font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px\">Payment schedule<\u002Fdiv>\n<div style=\"font-size: 14px; color: #55605C\">Set once per quote. Percentages here are examples.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<div style=\"min-width: 540px\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 96px 120px 110px 36px; gap: 8px; padding: 8px 16px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #55605C; background: #E7EBE7\">\n<div>Stage<\u002Fdiv>\n<div>Share<\u002Fdiv>\n<div style=\"text-align: right\">Amount<\u002Fdiv>\n<div>Status<\u002Fdiv>\n<div><\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{pay}}\" as=\"p\" hint-placeholder-count=\"4\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 96px 120px 110px 36px; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid #DDE1DD\">\n<input type=\"text\" aria-label=\"{{p.nameLabel}}\" value=\"{{p.name}}\" sc-camel-on-change=\"{{p.setName}}\">\n<div style=\"display: flex; gap: 4px; align-items: center\">\n<input type=\"text\" inputmode=\"decimal\" aria-label=\"Share in percent\" value=\"{{p.pct}}\" sc-camel-on-change=\"{{p.setPct}}\" style=\"flex: 1 1 0; min-width: 0; width: auto\">\n<div style=\"color: #55605C\">%<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align: right; font-weight: 600\">{{p.amount}}<\u002Fdiv>\n<div>\n<sc-if value=\"{{p.billed}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: inline-block; padding: 6px 10px; border-radius: 4px; background: #DDF0E6; color: #123D2A; font-weight: 600; font-size: 14px\">Billed<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{p.open}}\" hint-placeholder-val=\"{{true}}\">\n<button type=\"button\" sc-camel-on-click=\"{{p.bill}}\" style=\"height: 40px; padding: 0 14px; border: 1px solid #1B2321; border-radius: 4px; font-weight: 600; background: {{p.btnBg}}; color: {{p.btnFg}}\">Bill now<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<button type=\"button\" aria-label=\"Remove stage\" title=\"Remove stage\" sc-camel-on-click=\"{{p.remove}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8A1F11\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 96px 120px 110px 36px; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid #DDE1DD; background: #F6F8F6\">\n<div style=\"font-weight: 600; padding-left: 10px\">Final payment (balance)<\u002Fdiv>\n<div style=\"color: #55605C\">{{finalPct}}%<\u002Fdiv>\n<div style=\"text-align: right; font-weight: 600\">{{finalAmount}}<\u002Fdiv>\n<div>\n<sc-if value=\"{{finalBilled}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: inline-block; padding: 6px 10px; border-radius: 4px; background: #DDF0E6; color: #123D2A; font-weight: 600; font-size: 14px\">Billed<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{finalOpen}}\" hint-placeholder-val=\"{{true}}\">\n<button type=\"button\" sc-camel-on-click=\"{{billFinal}}\" style=\"height: 40px; padding: 0 14px; border: 1px solid #1B2321; border-radius: 4px; font-weight: 600; background: {{finalBg}}; color: {{finalFg}}\">Bill now<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 12px 16px; border-top: 1px solid #DDE1DD; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{addStage}}\" style=\"height: 44px; padding: 0 14px; border: 1px dashed #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600\">+ Add stage<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{addVo}}\" style=\"height: 44px; padding: 0 14px; border: 1px dashed #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600\">+ Variation order<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{over}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"alert\" style=\"padding: 10px 12px; background: #FBE3DF; border: 1px solid #8A1F11; border-radius: 4px; color: #5E130A; font-size: 14px\">The stages add up to more than 100%. Reduce a share so there is a balance left for the final payment.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{hasBillMsg}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"status\" style=\"padding: 10px 12px; background: #DDF0E6; border: 1px solid #2E7D57; border-radius: 4px; color: #123D2A; font-size: 14px\">{{billMsg}} Mock-up only, nothing was sent.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{voOn}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"status\" style=\"padding: 10px 12px; background: #FFF3C4; border: 1px solid #E0B93A; border-radius: 4px; color: #4A3A00; font-size: 14px\">A variation order opens a blank line editor like the one above for the extra items only. It is billed in full as its own invoice (VO1, VO2) and does not change the stage amounts.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-size: 14px; color: #55605C\">Bill now creates a one-line approved invoice in Xero for that stage, numbered INV-YYYYMMDD-XX, so it shows on the client's statement of account. No retyping of the quote lines.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 0 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #FFFFFF; border: 1px solid #C9D0CB; border-radius: 6px\">\n<div style=\"display: flex; justify-content: space-between; gap: 16px\">\n<div style=\"color: #55605C\">Subtotal<\u002Fdiv>\n<div style=\"font-weight: 600\">{{subtotal}}<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{noDisc}}\" hint-placeholder-val=\"{{true}}\">\n<button type=\"button\" sc-camel-on-click=\"{{addDisc}}\" style=\"align-self: flex-start; height: 44px; padding: 0 14px; border: 1px dashed #1B2321; border-radius: 4px; background: #FFFFFF; font-weight: 600\">+ Add discount<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{discOn}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n<label for=\"disc-val\" style=\"color: #55605C; flex: 1 1 70px\">Discount<\u002Flabel>\n<sc-raw-select id=\"disc-mode\" aria-label=\"Discount type\" value=\"{{discMode}}\" sc-camel-on-change=\"{{setDiscMode}}\" style=\"width: 72px; flex: none; padding: 0 6px\">\n<option value=\"$\">$<\u002Foption>\n<option value=\"%\">%<\u002Foption>\n<\u002Fsc-raw-select>\n<input id=\"disc-val\" type=\"text\" inputmode=\"decimal\" placeholder=\"0\" value=\"{{discVal}}\" sc-camel-on-change=\"{{setDiscVal}}\" style=\"width: 84px; flex: none\">\n<div style=\"font-weight: 600; min-width: 84px; text-align: right\">{{discAmount}}<\u002Fdiv>\n<button type=\"button\" aria-label=\"Remove discount\" title=\"Remove discount\" sc-camel-on-click=\"{{removeDisc}}\" style=\"width: 36px; height: 40px; padding: 0; border: 1px solid #B9C1BC; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8A1F11\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding-top: 10px; border-top: 1px solid #DDE1DD\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-weight: 600\">Contract sum (SGD)<\u002Fdiv>\n<div style=\"font-size: 13px; color: #55605C\">No GST<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px\">{{total}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{send}}\" style=\"height: 48px; padding: 0 20px; border: 0; border-radius: 4px; background: #1B2321; color: #FFFFFF; font-weight: 600; font-size: 16px\">Save quote<\u002Fbutton>\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"status\" style=\"padding: 10px 12px; background: #DDF0E6; border: 1px solid #2E7D57; border-radius: 4px; color: #123D2A; font-size: 14px\">Quote saved with {{lineCount}} lines. The prices are added to your price history as {{typeLabel}} quotes. Mock-up only, nothing was saved.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; color: #55605C; font-size: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-weight: 600; color: #1B2321\">Price memory<\u002Fdiv>\n<div>Every line you quote is saved with its price, date, client and property type. Only a past quote for the same property type fills the price. If there is none, the price stays blank and the other types are shown for reference.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-weight: 600; color: #1B2321\">Section titles<\u002Fdiv>\n<div>Titles are optional. Add one with + Title on any line. A title shows the subtotal of the lines under it and goes to Xero as a description-only row.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-weight: 600; color: #1B2321\">Units and discounts<\u002Fdiv>\n<div>The unit box is hidden until you tick Show unit, or pick a past item priced per sqft or ft run. A discount is added only when you press + Add discount.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:1100}}\">\nclass Component extends DCLogic {\nstate = {\nstage: 'variation',\nptype: 'HDB',\nshowUnit: false,\ndiscOn: false,\ndiscMode: '$',\ndiscVal: '',\nactiveId: 3,\nsent: false,\nnextId: 7,\npayNext: 5,\ninvSeq: 1,\nfinalBilled: false,\nbillMsg: '',\nvoOn: false,\npay: [\n{ id: 1, name: 'Deposit', pct: '30', billed: true },\n{ id: 2, name: 'Progress payment 1', pct: '20', billed: false },\n{ id: 3, name: 'Progress payment 2', pct: '20', billed: false },\n{ id: 4, name: 'Progress payment 3', pct: '20', billed: false }\n],\nlines: [\n{ id: 1, kind: 'title', desc: 'Living room', trade: '', qty: '', unit: '', price: '', picked: null },\n{ id: 2, kind: 'item', desc: 'Supply & install 13A double socket outlet', trade: 'Electrical', qty: '4', unit: 'pcs', price: '88.00', picked: 'Supply & install 13A double socket outlet' },\n{ id: 3, kind: 'item', desc: 'led down', trade: 'Electrical', qty: '6', unit: '', price: '', picked: null },\n{ id: 4, kind: 'title', desc: 'Dining room', trade: '', qty: '', unit: '', price: '', picked: null },\n{ id: 5, kind: 'item', desc: 'Supply & install LED downlight', trade: 'Electrical', qty: '4', unit: 'pcs', price: '45.00', picked: 'Supply & install LED downlight' },\n{ id: 6, kind: 'item', desc:
